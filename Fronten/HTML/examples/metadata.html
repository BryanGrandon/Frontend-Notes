<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Character encoding -->
    <meta charset="UTF-8" />

    <!-- Responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO / Google -->
    <meta name="description" content="Learn the basics of HTML structure, semantic elements, and best practices." />

    <!-- Theme color (mobile browsers) -->
    <meta name="theme-color" content="#0f172a" />

    <!-- Social media (Open Graph / Facebook) -->
    <meta property="og:title" content="HTML Basics" />
    <meta property="og:description" content="A guide to understanding HTML document structure and semantics." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://example.com" />
    <meta property="og:image" content="https://example.com/preview.png" />

    <!-- Social media (Twitter Cards) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HTML Basics" />
    <meta name="twitter:description" content="Learn how HTML works with clear and semantic structure." />
    <meta name="twitter:image" content="https://example.com/preview.png" />

    <!-- HTTP simulation -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
  </head>
  <body></body>
</html>
