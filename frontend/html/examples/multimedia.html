<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- Image -->
    <img src="image.jpg" alt="Example image" width="300" />

    <!-- Audio -->
    <audio controls>
      <source src="audio.mp3" type="audio/mpeg" />
      Your browser does not support the audio element.
    </audio>

    <!-- <iframe> – External Content -->
    <iframe src="https://www.youtube.com/embed/VIDEO_ID" width="560" height="315" allowfullscreen> </iframe>

    <!-- <source> – Media Source -->

    <video controls>
      <source src="video.mp4" type="video/mp4" />
      <source src="video.webm" type="video/webm" />
    </video>

    <!-- <track> – Subtitles / Captions -->
    <video controls width="400">
      <source src="video.mp4" type="video/mp4" />
      <track src="subtitles.vtt" kind="subtitles" srclang="en" label="English" />
    </video>

    <!-- <canvas> – Graphics -->
    <canvas id="myCanvas" width="200" height="100"></canvas>

    <script>
      const canvas = document.getElementById('myCanvas')
      const ctx = canvas.getContext('2d')
      ctx.fillStyle = 'green'
      ctx.fillRect(20, 20, 150, 60)
    </script>

    <!-- <picture> – Responsive Images -->
    <picture>
      <source srcset="image-large.jpg" media="(min-width: 800px)" />
      <source srcset="image-small.jpg" media="(max-width: 799px)" />
      <img src="image-default.jpg" alt="Responsive image" />
    </picture>
  </body>
</html>
